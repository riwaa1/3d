<!DOCTYPE html>
<html lang="fr" dir="ltr"><head><meta charset="utf-8"><title>Maquette 3D de la maison</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#eef1f5;--fg:#1d2430;--bar:rgba(255,255,255,.92);--bd:rgba(128,128,128,.4);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b22;--fg:#e8ecf2;--bar:rgba(30,35,45,.94)}}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none}
#c{display:block;width:100%;height:100%}
#bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:6px;right:6px;display:flex;gap:6px;flex-wrap:wrap}
button,input,select,textarea{background:var(--bar);color:var(--fg);border:1px solid var(--bd);border-radius:8px;font-family:inherit}
button{padding:8px 11px;font-size:14px}button.on{background:#e8832a;color:#fff}
#t{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:8px;right:8px;text-align:center;font-size:13px;opacity:.75;pointer-events:none}
#panel{position:fixed;left:0;right:0;bottom:0;max-height:42vh;overflow:auto;background:var(--bar);padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);display:none;font-size:14px;touch-action:pan-y;border-top:1px solid var(--bd)}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0}label{display:flex;flex-direction:column;font-size:12px}
input,select,textarea{font-size:15px;width:100%;box-sizing:border-box;padding:5px}input[type=checkbox]{width:auto}
.r{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.o{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:6px;margin:4px 0}
</style></head><body>
<canvas id="c"></canvas>
<div id="bar"><button id="be">Modifier · تعديل</button><button id="b1">Dessus · من الأعلى</button><button id="b2">Perspective · منظور</button><button id="b3">Toits · الأسقف</button><button id="rl">◀</button><button id="rr">▶</button><button id="ru">▲</button><button id="rd">▼</button><button id="zi">＋</button><button id="zo">－</button><button id="ar">Auto · تلقائي</button></div>
<div id="t">Glisser : tourner · Deux doigts : zoom/déplacer<br>اسحب للتدوير · بإصبعين للتكبير والتحريك</div>
<div id="panel"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const dark=matchMedia('(prefers-color-scheme:dark)').matches;
const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();S.background=new THREE.Color(dark?0x171b22:0xeef1f5);
const cam=new THREE.PerspectiveCamera(45,1,.1,200);
S.add(new THREE.HemisphereLight(0xffffff,0x778899,.85));
const L=new THREE.DirectionalLight(0xffffff,.6);L.position.set(10,25,-8);S.add(L);
const H=3,T=.2,W=21.6,DZ=8;
const C=n=>'#'+n.toString(16).padStart(6,'0');
const DEF={rooms:[['Chambre 3',0,0,3.1,4,0xd9c7a8],['Chambre 1',0,5,3.1,8,0xd9c7a8],['Chambre 2',0,4,3.1,5,0xcfd4da],['cour',3.1,0,5.6,4,0xb7d6a8],['Cuisine',5.6,0,9.6,4,0xf0d9a0],['Hall',3.1,4,9.6,6.5,0xe3dccb],['Hall',5.6,6.5,9.6,8,0xe3dccb],['cour',3.1,6.5,5.6,8,0xb7d6a8],['Garage',9.6,0,21.6,4,0xb9bdc4],['Salon',11.6,4,18.6,7,0xe8c9c0],['Douche + Toilette',9.6,4,11.6,7,0xa9d3de],['Couloir',9.6,7,18.6,8,0xcfd4da],['Cour d’entrée',18.6,4,21.6,8,0xb7d6a8]].map(([n,a,b,c,d,col])=>({n,a,b,c,d,col:C(col),r:n.toLowerCase().startsWith('cour')?0:1})),
walls:[[0,0,21.6,0,3,[[1,2.2,'w'],[11.4,16.2,'d'],[19.5,21,'w']]],[0,8,18.6,8,3,[[1,2.2,'w'],[4,5.2,'w'],[7,8.4,'w'],[11,12.4,'w'],[15,16.4,'w']]],[18.6,8,21.6,8,1.2,[]],[0,0,0,8,3,[[1.2,2.2,'w'],[5,6,'w']]],[21.6,4,21.6,5.4,1.2,[]],[21.6,6.6,21.6,8,1.2,[]],[21.6,5.25,21.6,5.55,2.2,[]],[21.6,6.45,21.6,6.75,2.2,[]],[21.6,0,21.6,4,3,[]],[18.6,4,21.6,4,3,[]],[3.1,0,3.1,8,3,[[1,2,'d'],[4.2,4.9,'d'],[5.3,6.2,'d']]],[5.6,0,5.6,4,3,[]],[5.6,6.5,5.6,8,3,[]],[9.6,0,9.6,7,3,[[1.2,2.2,'d']]],[18.6,4,18.6,7,3,[[1,2.4,'d']]],[0,4,3.1,4,3,[]],[0,5,3.1,5,3,[]],[3.1,4,9.6,4,3,[[.7,1.7,'d'],[3,4.2,'d']]],[9.6,4,18.6,4,3,[[4.4,5.4,'d']]],[11.6,4,11.6,7,3,[[1.2,2.2,'d']]],[9.6,7,18.6,7,3,[]],[3.1,6.5,5.6,6.5,3,[[.6,1.5,'d']]]].map(([a,b,c,d,h,g])=>({a,b,c,d,h,g}))};
const clone=o=>JSON.parse(JSON.stringify(o));
let M=null;try{const s=localStorage.getItem('maison3d_v2');if(s)M=JSON.parse(s)}catch(e){}
if(!M||!M.rooms||!M.walls)M=clone(DEF);
let hist=[],sel=null,edit=false,rf=false,showJS=false,auto=false;
const snap=()=>{hist.push(JSON.stringify(M));if(hist.length>40)hist.shift()};
const save=()=>{try{localStorage.setItem('maison3d_v2',JSON.stringify(M))}catch(e){}};
const G=new THREE.Group();S.add(G);
const wallM=new THREE.MeshLambertMaterial({color:0xf4efe6}),selM=new THREE.MeshLambertMaterial({color:0xffa24a}),glass=new THREE.MeshLambertMaterial({color:0x7fc4ff,transparent:true,opacity:.55});
function wall(q,i){
 const dx=q.c-q.a,dz=q.d-q.b,len=Math.hypot(dx,dz);if(len<.05)return;const ux=dx/len,uz=dz/len,h=+q.h||H;
 const on=sel&&sel.t==='w'&&sel.i===i,rot=-Math.atan2(uz,ux);
 const seg=(a,b,y0,y1,m)=>{const hh=y1-y0;if(b-a<.01||hh<=.01)return;const c=(a+b)/2;
  const k=new THREE.Mesh(new THREE.BoxGeometry(b-a,hh,T),m||(on?selM:wallM));k.position.set(+q.a+ux*c,y0+hh/2,+q.b+uz*c);k.rotation.y=rot;k.userData={t:'w',i};G.add(k)};
 const gs=q.g.map(g=>[Math.max(0,+g[0]),Math.min(len,+g[1]),g[2]]).filter(g=>g[1]>g[0]).sort((p,r)=>p[0]-r[0]);let p=0;
 for(const[a,b,k]of gs){seg(p,a,0,h);
  if(k==='w'){seg(a,b,0,Math.min(.9,h));seg(a,b,2.1,h);seg(a,b,.9,Math.min(2.1,h),on?selM:glass)}else seg(a,b,2.1,h);p=Math.max(p,b)}
 seg(p,len,0,h)}
function build(){
 while(G.children.length)G.remove(G.children[0]);
 M.rooms.forEach((r,i)=>{const w=r.c-r.a,d=r.d-r.b;if(w<=.05||d<=.05)return;const on=sel&&sel.t==='r'&&sel.i===i;
  const f=new THREE.Mesh(new THREE.BoxGeometry(w,.05,d),new THREE.MeshLambertMaterial({color:r.col,emissive:on?0x663300:0}));
  f.position.set((+r.a+ +r.c)/2,.025+i*.002,(+r.b+ +r.d)/2);f.userData={t:'r',i};G.add(f);
  const cv=document.createElement('canvas');cv.width=256;cv.height=96;const g=cv.getContext('2d');
  g.fillStyle='rgba(20,25,35,.72)';g.fillRect(0,0,256,96);g.fillStyle='#fff';g.font='bold 30px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(r.n,128,48);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false}));s.scale.set(2.4,.9,1);s.position.set((+r.a+ +r.c)/2,.6,(+r.b+ +r.d)/2);s.renderOrder=9;G.add(s);
  if(+r.r){const t=new THREE.Mesh(new THREE.BoxGeometry(w,.12,d),new THREE.MeshLambertMaterial({color:0x9a6b55}));t.position.set((+r.a+ +r.c)/2,H,(+r.b+ +r.d)/2);t.visible=rf;G.add(t)}});
 M.walls.forEach(wall)}
// camera
let th=.9,ph=.95,rad=30,tg=new THREE.Vector3(W/2,0,4);
function upd(){cam.position.set(tg.x+rad*Math.sin(ph)*Math.sin(th),rad*Math.cos(ph),tg.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(tg)}
function size(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
function pan(dx,dy){const k=rad*.0016,rx=Math.cos(th),rz=-Math.sin(th),fx=-Math.sin(th),fz=-Math.cos(th);tg.x=Math.min(W,Math.max(0,tg.x-rx*dx*k+fx*dy*k));tg.z=Math.min(DZ+2,Math.max(-2,tg.z-rz*dx*k+fz*dy*k));upd()}
const rc=new THREE.Raycaster(),v2=new THREE.Vector2();
function pick(e){v2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);rc.setFromCamera(v2,cam);
 const h=rc.intersectObjects(G.children).find(o=>o.object.userData.t);sel=h?{t:h.object.userData.t,i:h.object.userData.i}:null;build();panel()}
const pts=new Map();let dn=[0,0];const cv=R.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===1)dn=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',e=>{const one=pts.size===1;pts.delete(e.pointerId);if(edit&&one&&Math.hypot(e.clientX-dn[0],e.clientY-dn[1])<6)pick(e)});
cv.addEventListener('pointercancel',e=>pts.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId);
 if(pts.size===1){if(e.buttons&2||e.shiftKey)pan(e.clientX-o[0],e.clientY-o[1]);else{th-=(e.clientX-o[0])*.007;ph=Math.min(1.5,Math.max(.05,ph-(e.clientY-o[1])*.007))}}
 else{const q=[...pts.entries()].find(([k])=>k!==e.pointerId)[1];const d0=Math.hypot(o[0]-q[0],o[1]-q[1]),d1=Math.hypot(e.clientX-q[0],e.clientY-q[1]);rad=Math.min(60,Math.max(6,rad*d0/d1));pan((e.clientX-o[0])/2,(e.clientY-o[1])/2)}
 pts.set(e.pointerId,[e.clientX,e.clientY]);upd()});
cv.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(60,Math.max(6,rad*(1+e.deltaY*.001)));upd()},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const $=id=>document.getElementById(id);
const hold=(id,fn)=>{const b=$(id);let t;const stop=()=>clearInterval(t);b.addEventListener('pointerdown',e=>{e.stopPropagation();fn();t=setInterval(fn,60)});['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,stop))};
hold('rl',()=>{th+=.06;upd()});hold('rr',()=>{th-=.06;upd()});hold('ru',()=>{ph=Math.max(.05,ph-.04);upd()});hold('rd',()=>{ph=Math.min(1.5,ph+.04);upd()});hold('zi',()=>{rad=Math.max(6,rad*.97);upd()});hold('zo',()=>{rad=Math.min(60,rad*1.03);upd()});
$('ar').onclick=()=>{auto=!auto;$('ar').classList.toggle('on',auto)};
$('b1').onclick=()=>{ph=.05;th=0;rad=26;tg.set(W/2,0,4);upd()};$('b2').onclick=()=>{ph=.95;th=.9;rad=30;tg.set(W/2,0,4);upd()};
$('b3').onclick=()=>{rf=!rf;$('b3').classList.toggle('on',rf);build()};
$('be').onclick=()=>{edit=!edit;$('be').classList.toggle('on',edit);$('t').style.display=edit?'none':'block';if(!edit)sel=null;build();panel()};
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const m={ArrowLeft:()=>th+=.08,ArrowRight:()=>th-=.08,ArrowUp:()=>ph=Math.max(.05,ph-.05),ArrowDown:()=>ph=Math.min(1.5,ph+.05)}[e.key];if(m){m();upd()}});
// editor panel
const P=$('panel'),r2=x=>Math.round(x*10)/10;
const num=(o,k,l)=>`<label>${l}<input type="number" step="0.1" data-f="${k}" value="${+(+o[k]).toFixed(2)}"></label>`;
function panel(){
 if(!edit){P.style.display='none';return}P.style.display='block';
 let h='<div class="r"><button data-act="ad">+ Mur · جدار</button><button data-act="ap">+ Pièce · غرفة</button><button data-act="un">Annuler · تراجع</button><button data-act="js">JSON</button><button data-act="rs">Réinitialiser · إعادة</button></div>';
 if(showJS)h+=`<textarea id="jt" rows="5">${JSON.stringify(M)}</textarea><div class="r"><button data-act="im">Appliquer · تطبيق</button></div>`;
 if(sel&&sel.t==='w'&&M.walls[sel.i]){const q=M.walls[sel.i];
  h+=`<b>Mur · جدار ${sel.i+1}</b><div class="g">`+[['a','x1'],['b','z1'],['c','x2'],['d','z2'],['h','haut. ارتفاع']].map(([k,l])=>num(q,k,l)).join('')+'</div>';
  q.g.forEach((g,j)=>{h+=`<div class="o"><select data-gf="k" data-gi="${j}"><option value="d" ${g[2]==='d'?'selected':''}>Porte · باب</option><option value="w" ${g[2]==='w'?'selected':''}>Fenêtre · نافذة</option></select><input type="number" step="0.1" data-gf="0" data-gi="${j}" value="${+(+g[0]).toFixed(2)}"><input type="number" step="0.1" data-gf="1" data-gi="${j}" value="${+(+g[1]).toFixed(2)}"><button data-act="delg" data-gi="${j}">✕</button></div>`});
  h+='<div class="r"><button data-act="pd">+ Porte · باب</button><button data-act="pw">+ Fenêtre · نافذة</button><button data-act="dup">Dupliquer · نسخ</button><button data-act="del">Supprimer · حذف</button></div>'}
 else if(sel&&sel.t==='r'&&M.rooms[sel.i]){const q=M.rooms[sel.i];
  h+=`<b>Pièce · غرفة</b><div class="r"><input type="text" data-f="n" value="${q.n.replace(/"/g,'&quot;')}"><input type="color" data-f="col" value="${q.col}" style="width:54px"></div><div class="g">`+[['a','x1'],['b','z1'],['c','x2'],['d','z2']].map(([k,l])=>num(q,k,l)).join('')+`<label>Toit · سقف<input type="checkbox" data-f="r" ${+q.r?'checked':''}></label></div><div class="r"><button data-act="dup">Dupliquer · نسخ</button><button data-act="del">Supprimer · حذف</button></div>`}
 else h+='<small>Touchez un mur ou un sol pour le modifier. Mesures en mètres (x = longueur, z = largeur).<br>المس جداراً أو أرضية لتعديلها. القياسات بالمتر (x الطول، z العرض).</small>';
 P.innerHTML=h}
P.onchange=e=>{const t=e.target,d=t.dataset;if(d.f===undefined&&d.gf===undefined)return;snap();
 const o=sel.t==='w'?M.walls[sel.i]:M.rooms[sel.i];
 if(d.gf!==undefined){const g=o.g[+d.gi];if(d.gf==='k')g[2]=t.value;else g[+d.gf]=+t.value}
 else o[d.f]=t.type==='number'?+t.value:t.type==='checkbox'?(t.checked?1:0):t.value;
 save();build()};
P.onclick=e=>{const d=e.target.dataset,a=d.act;if(!a)return;
 if(a==='js'){showJS=!showJS;return panel()}
 if(a==='un'){if(hist.length){M=JSON.parse(hist.pop());sel=null;save();build();panel()}return}
 if(a==='im'){try{const n=JSON.parse($('jt').value);if(!n.rooms||!n.walls)throw 0;snap();M=n;sel=null;save();build();panel()}catch(x){alert('JSON invalide · JSON غير صالح')}return}
 snap();const w=sel&&sel.t==='w'?M.walls[sel.i]:null,rm=sel&&sel.t==='r'?M.rooms[sel.i]:null;
 if(a==='ad'){M.walls.push({a:r2(tg.x-2),b:r2(tg.z),c:r2(tg.x+2),d:r2(tg.z),h:H,g:[]});sel={t:'w',i:M.walls.length-1}}
 else if(a==='ap'){M.rooms.push({n:'Nouvelle pièce',a:r2(tg.x-1.5),b:r2(tg.z-1.5),c:r2(tg.x+1.5),d:r2(tg.z+1.5),col:'#cccccc',r:1});sel={t:'r',i:M.rooms.length-1}}
 else if(a==='rs'){if(confirm('Revenir au plan d’origine ? · العودة إلى المخطط الأصلي؟')){M=clone(DEF);sel=null}else hist.pop()}
 else if(a==='del'){if(w)M.walls.splice(sel.i,1);else if(rm)M.rooms.splice(sel.i,1);sel=null}
 else if(a==='dup'){if(w){const c=clone(w);c.b+=.5;c.d+=.5;M.walls.push(c);sel={t:'w',i:M.walls.length-1}}else if(rm){const c=clone(rm);c.b+=.5;c.d+=.5;M.rooms.push(c);sel={t:'r',i:M.rooms.length-1}}}
 else if(a==='pd'||a==='pw'){if(w){const len=Math.hypot(w.c-w.a,w.d-w.b),s=r2(len/2-.5);w.g.push([s,s+(a==='pd'?1:1.2),a==='pd'?'d':'w'])}}
 else if(a==='delg'){if(w)w.g.splice(+d.gi,1)}
 save();build();panel()};
build();upd();
(function loop(){if(auto){th+=.004;upd()}R.render(S,cam);requestAnimationFrame(loop)})();
</script></body></html>
